<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1d130e">
  <meta name="description" content="Un detalle hecho con cuidado.">
  <meta property="og:title" content="Un detalle">
  <meta property="og:description" content="Hecho con cuidado, solo para ti.">
  <title>Un detalle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="page" id="page">

    <button class="cup" id="cup" type="button" aria-pressed="false" aria-label="Reproducir canción">
      <span class="cup__saucer"></span>
      <span class="cup__bean cup__bean--one"></span>
      <span class="cup__bean cup__bean--two"></span>
      <span class="cup__handle"></span>
      <span class="cup__body">
        <span class="cup__coffee">
          <span class="cup__disc"><span class="cup__label"></span></span>
        </span>
      </span>
    </button>
    <p class="hint" id="hint" aria-live="polite"></p>

    <h1 class="title">Mi café favorito es el de tus <em>ojos</em></h1>

    <div class="message">
      <p>Tú eres la experta en el tema; yo solo un aficionado que sabe admirar lo que es único.</p>
      <p class="message__soft">Esto es solo un detalle, hecho con cuidado, para que hoy te sientas tan bonita como te ves.</p>
    </div>

    <p class="invitation">Si algún día te provoca un café, me dices. Solo si tú quieres.</p>

    <a class="reply" id="reply" href="#" target="_blank" rel="noopener" hidden>Decirme algo</a>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
